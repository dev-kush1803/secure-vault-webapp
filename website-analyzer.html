<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SecureVault — Website Analyzer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside id="sidebar"></aside>

  <main class="main">
    <header class="topbar card"><h2>AI Website Security Analyzer</h2></header>

    <section class="card">
      <h3>Website Security Analyzer</h3>
      <p class="muted">Enter a website URL to get a simulated, AI-powered security analysis.</p>

      <div class="row" style="gap:12px;margin-top:12px;">
        <input id="site-input" placeholder="https://example.com" style="flex:1">
        <button id="site-btn" class="btn ghost">Analyze Website</button>
      </div>

      <div id="site-result" style="margin-top:14px;"></div>
    </section>
  </main>

  <script type="module" src="js/sidebar.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    document.getElementById('site-btn').addEventListener('click', async ()=>{
      const url = document.getElementById('site-input').value.trim();
      const out = document.getElementById('site-result');
      if(!url) return out.innerHTML = '<span class="muted">Enter a site to analyze.</span>';
      out.innerHTML = 'Analyzing...';
      await new Promise(r=>setTimeout(r,900));
      out.innerHTML = `<strong style="color:#00ffb3">Analysis complete</strong><div class="muted small">No critical issues detected for ${url} (simulated).</div>`;
    });
  </script>
</body>
</html>
