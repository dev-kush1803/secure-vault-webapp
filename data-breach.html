<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SecureVault — Data Breach</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside id="sidebar"></aside>

  <main class="main">
    <header class="topbar card"><h2>Data Breach Monitoring</h2></header>

    <section class="card breach-card">
      <h3>Data Breach Monitoring</h3>
      <p class="muted">Check if your personal identifiers have appeared in breaches.</p>

      <div class="tabs small">
        <button class="tab active">Email</button>
        <button class="tab">Phone No.</button>
        <button class="tab">Username</button>
        <button class="tab">Aadhar Card</button>
        <button class="tab">PAN Card</button>
      </div>

      <div class="row" style="gap:12px;margin-top:12px;">
        <input id="breach-input" placeholder="Enter email address" style="flex:1">
        <button id="breach-btn" class="btn ghost">Search for Breaches</button>
      </div>

      <div id="breach-result" style="margin-top:14px;"></div>
    </section>
  </main>

  <script type="module" src="js/sidebar.js"></script>
  <script type="module" src="js/app.js"></script>
  <!-- put this in pages where theme must be available -->
  <script type="module" src="js/theme.js"></script>

  <script>
    document.getElementById('breach-btn').addEventListener('click', async ()=>{
      const q = document.getElementById('breach-input').value.trim();
      const out = document.getElementById('breach-result');
      if(!q) return out.innerHTML = '<span class="muted">Enter a query to search.</span>';
      out.innerHTML = 'Performing OSINT check...';
      await new Promise(r=>setTimeout(r,1200));
      const leaked = /pwned|leak|breach|password/i.test(q+Math.random());
      out.innerHTML = leaked ? `<strong style="color:#ff6b6b">Possible leak found</strong><div class="muted small">Some public data may reference this identifier.</div>` : `<strong style="color:#00ffb3">No public breaches found</strong>`;
    });
  </script>
</body>
</html>
