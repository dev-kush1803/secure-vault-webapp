<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SecureVault — AI Assistant</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside id="sidebar"></aside>

  <main class="main">
    <header class="topbar card">
      <h2>AI Cybersecurity Assistant</h2>
      <div class="profile-circle">👤</div>
    </header>

    <section class="card chat-card">
      <div id="chat-messages" class="chat-messages">
        <div class="msg assistant">
          <div class="avatar">🛡️</div>
          <div class="bubble">Hello! I'm the SecureVault Cybersecurity Assistant. How can I help you today?</div>
        </div>
      </div>

      <div class="chat-input row">
        <input id="chat-in" placeholder="Ask about cybersecurity..." />
        <button id="chat-send" class="btn primary">➤</button>
      </div>
    </section>
  </main>

  <script type="module" src="js/sidebar.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/ai-assistant.js"></script>
  <!-- put this in pages where theme must be available -->
  <script type="module" src="js/theme.js"></script>



  <script type="module" src="js/sidebar.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
