<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SecureVault — Password Vault</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <aside id="sidebar"></aside>

  <main class="main">
    <header class="topbar card"><h2>Password Vault</h2></header>

    <section class="card">
      <h3>Your Credentials</h3>

      <div class="controls row between">
        <input id="pv-search" placeholder="Search by website or username..." class="search-input" />
        <div class="row">
          <button id="btn-recycle" class="btn ghost">Recycle Bin</button>
          <button id="btn-add" class="btn primary">Add New</button>
        </div>
      </div>

      <table class="pw-table" id="entries-table">
        <thead><tr><th>Website</th><th>Username</th><th>Password</th><th>Strength</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <!-- Create / Unlock / Change password modals (simple) -->
  <div id="modal" class="modal hidden">
    <div class="modal-card card">
      <h3 id="modal-title">Vault</h3>
      <div id="modal-body"></div>
      <div class="row" style="gap:8px;margin-top:12px;">
        <button id="modal-cancel" class="btn ghost">Cancel</button>
        <button id="modal-ok" class="btn primary">OK</button>
      </div>
    </div>
  </div>

  <div style="position:fixed;bottom:20px;right:20px;display:flex;gap:8px;">
    <button id="btn-export" class="btn ghost">Export</button>
    <button id="btn-import" class="btn ghost">Import</button>
    <button id="btn-change-pass" class="btn ghost">Change Master Password</button>
  </div>

  <input id="import-file" type="file" accept="application/json" hidden />

  <script type="module" src="js/sidebar.js"></script>
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/crypto.js"></script>
  <script type="module" src="js/db.js"></script>
  <script type="module" src="js/password-vault.js"></script>
</body>
</html>
