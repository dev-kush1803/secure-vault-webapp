<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SecureVault — File Scanner</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside id="sidebar"></aside>

  <main class="main">
    <header class="topbar card"><h2>File Security Scanner</h2></header>

    <section class="card scan-card">
      <h3>Scan for Threats</h3>
      <div class="tabs">
        <button class="tab active">Upload File</button>
        <button class="tab">Scan from URL</button>
      </div>

      <div class="drop-area" id="drop-area">
        <p>Drag & drop, or click to upload</p>
        <input id="file-input" type="file" hidden>
        <button id="btn-choose" class="btn ghost">Choose file</button>
        <p class="muted small">Simulated scan based on file name</p>
      </div>

      <div id="scan-result" class="muted small" style="margin-top:18px;"></div>
    </section>
  </main>

  <script type="module" src="js/sidebar.js"></script>
  <script type="module" src="js/app.js"></script>
  <script>
    // simple client-side simulated scan
    const drop = document.getElementById('drop-area');
    const fileInput = document.getElementById('file-input');
    const choose = document.getElementById('btn-choose');
    const result = document.getElementById('scan-result');

    choose.addEventListener('click', ()=>fileInput.click());
    drop.addEventListener('click', ()=>fileInput.click());

    fileInput.addEventListener('change', async (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      result.textContent = 'Scanning ' + f.name + ' ...';
      await new Promise(r=>setTimeout(r,1200));
      const suspicious = /virus|malware|trojan|worm|infected/i.test(f.name);
      result.innerHTML = suspicious ? `<strong style="color:#ff6b6b">Threat found:</strong> Suspicious filename matched.` : `<strong style="color:#00ffb3">No threats detected</strong>`;
    });

    drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('drag'); });
    drop.addEventListener('dragleave', e=>{ e.preventDefault(); drop.classList.remove('drag'); });
    drop.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('drag'); fileInput.files = e.dataTransfer.files; fileInput.dispatchEvent(new Event('change')); });
  </script>
</body>
</html>
